version: "3.9"

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    env_file:
      - .env
    # Use gunicorn in production; runserver is dev-only
    #command: gunicorn DjangoProject.wsgi:application --bind 0.0.0.0:8000 --workers 2
    command: python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped